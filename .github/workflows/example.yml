name: TestCafe Tests

on:
  push:
    branches:
      - main
      - wip
  pull_request:

jobs:
  kind-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up KinD
        uses: helm/kind-action@v1.8.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Apply ConfigMap
        run: |
          kubectl apply -f minimal-test/testcafe-script-configmap.yaml
          kubectl apply -f minimal-test/pod.yaml

      - name: Wait for pod to complete
        run: |
          echo "Waiting for pod to complete execution..."
          kubectl wait --for=condition=Ready pod/minimal-testcafe-example --timeout=60s
          # Check pod status
          kubectl get pod minimal-testcafe-example -o wide

      - name: Get pod logs
        run: |
          echo "TestCafe test results:"
          kubectl logs minimal-testcafe-example
